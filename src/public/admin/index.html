<!-- Phase 17-7 Personal Agent Operation Logs / Usage History UI block.
If your current Admin index.html is already customized, merge this block into the Personal AI Agent section instead of replacing the whole file. -->

<section id="personal-agent-operation-logs" class="admin-section">
  <h2>Personal AI Agent - Operation Logs / Usage History</h2>
  <p>Phase 17-7 adds usage history and operation log review for the Personal AI Gateway Agent.</p>

  <div class="button-row">
    <button onclick="loadAgentOperationLogStatus && loadAgentOperationLogStatus()">Load Operation Log Status</button>
    <button onclick="loadAgentUsageHistory && loadAgentUsageHistory()">Load Usage History</button>
    <button onclick="runAgentOperationLogTest && runAgentOperationLogTest()">Run Operation Log Test</button>
  </div>

  <pre id="agent-operation-logs-output">Use Postman if this lightweight UI block is not wired to your current dashboard.js.</pre>
</section>

<script>
async function phase17FetchJson(url, options = {}) {
  const token = new URLSearchParams(window.location.search).get('token') || localStorage.getItem('adminToken') || '';
  const res = await fetch(url, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'x-admin-token': token,
      ...(options.headers || {})
    }
  });
  return res.json();
}
function phase17WriteOutput(data) {
  const el = document.getElementById('agent-operation-logs-output');
  if (el) el.textContent = JSON.stringify(data, null, 2);
}
window.loadAgentOperationLogStatus = async function () {
  phase17WriteOutput(await phase17FetchJson('/ai/agent/operation-logs/status'));
};
window.loadAgentUsageHistory = async function () {
  phase17WriteOutput(await phase17FetchJson('/ai/agent/usage-history', {
    method: 'POST',
    body: JSON.stringify({ project_code: 'all', provider: 'all', limit: 20 })
  }));
};
window.runAgentOperationLogTest = async function () {
  phase17WriteOutput(await phase17FetchJson('/ai/agent/operation-logs/test', {
    method: 'POST',
    body: JSON.stringify({ project_code: 'ai_memory_gateway', provider: 'mock', limit: 5 })
  }));
};
</script>
