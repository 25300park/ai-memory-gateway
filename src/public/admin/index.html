Add this section to the existing Personal AI Agent panel in src/public/admin/index.html.
Do not replace the whole file unless your current file is identical to the prior generated phase file.
-->
<section id="personal-agent-continue-project" class="admin-card">
  <h2>Personal AI Agent - Continue Project</h2>
  <p>Phase 17-6: load recent project memory and continue the project from stored context.</p>
  <label>Project Code</label>
  <select id="continueProjectCode">
    <option value="auto">Auto Detect</option>
    <option value="ai_memory_gateway">ai_memory_gateway</option>
    <option value="rbs_homes">rbs_homes</option>
    <option value="runquest_ph">runquest_ph</option>
    <option value="philippines_franchise">philippines_franchise</option>
    <option value="bgc_office_acquisition">bgc_office_acquisition</option>
  </select>
  <label>Provider</label>
  <select id="continueProvider">
    <option value="mock">Mock</option>
    <option value="auto">Auto Router</option>
    <option value="openai">OpenAI</option>
    <option value="anthropic">Claude</option>
    <option value="google">Gemini</option>
  </select>
  <label>Question / continuation request</label>
  <textarea id="continueQuestion" rows="5" placeholder="AI Memory Gateway 프로젝트 이어서 진행하겠습니다. 현재 상태와 다음 단계 알려주세요."></textarea>
  <label>Context Limit</label>
  <input id="continueContextLimit" type="number" value="8" min="1" max="20" />
  <label>Recent Limit</label>
  <input id="continueRecentLimit" type="number" value="5" min="1" max="20" />
  <button onclick="runContinueProject && runContinueProject()">Continue Project</button>
  <button onclick="runContinueProjectTest && runContinueProjectTest()">Run Continue Test</button>
  <pre id="continueProjectOutput"></pre>
</section>
<script>
async function runContinueProject(){
  const token = new URLSearchParams(location.search).get('token') || localStorage.getItem('adminToken') || '';
  const body = {
    project_code: document.getElementById('continueProjectCode').value,
    provider: document.getElementById('continueProvider').value,
    question: document.getElementById('continueQuestion').value,
    context_limit: Number(document.getElementById('continueContextLimit').value || 8),
    recent_limit: Number(document.getElementById('continueRecentLimit').value || 5),
    enqueue_summary: false,
    live: false,
    allow_fallback: true
  };
  const res = await fetch('/ai/agent/continue-project', {
    method: 'POST',
    headers: {'Content-Type':'application/json','x-admin-token':token},
    body: JSON.stringify(body)
  });
  document.getElementById('continueProjectOutput').textContent = JSON.stringify(await res.json(), null, 2);
}
async function runContinueProjectTest(){
  const token = new URLSearchParams(location.search).get('token') || localStorage.getItem('adminToken') || '';
  const body = {
    project_code: document.getElementById('continueProjectCode').value,
    provider: 'mock',
    question: document.getElementById('continueQuestion').value || 'AI Memory Gateway 프로젝트 이어서 진행하겠습니다. 현재 상태와 다음 단계 알려주세요.',
    context_limit: Number(document.getElementById('continueContextLimit').value || 5),
    recent_limit: Number(document.getElementById('continueRecentLimit').value || 3)
  };
  const res = await fetch('/ai/agent/continue-project/test', {
    method: 'POST',
    headers: {'Content-Type':'application/json','x-admin-token':token},
    body: JSON.stringify(body)
  });
  document.getElementById('continueProjectOutput').textContent = JSON.stringify(await res.json(), null, 2);
}
</script>
